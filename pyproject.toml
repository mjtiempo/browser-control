[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-control"
dynamic = ["version"]
description = "Drive this machine's Chromium over CDP, on a managed profile of its own"
requires-python = ">=3.11"
dependencies = ["websockets>=12"]
keywords = ["chromium", "cdp", "devtools", "headless", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.scripts]
browser-control-cli = "browser_control.cli.main:main"

[tool.setuptools]
packages = ["browser_control", "browser_control.lib", "browser_control.cli"]

[tool.setuptools.dynamic]
version = { attr = "browser_control.__version__" }
